services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bmatch
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d bmatch"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    build: ./rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  consul:
    image: hashicorp/consul:1.17
    command: ["agent", "-dev", "-client=0.0.0.0", "-config-dir=/consul/config"]
    ports: ["127.0.0.1:8500:8500"]
    volumes: ["./compose/consul:/consul/config:ro"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    build: ../bmatch-gateway
    environment:
      IS_PROD: "false"
      DB_HOST: postgres
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEME: bmatch
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_TOKEN: ${JWT_TOKEN:?Set JWT_TOKEN in .env}
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      consul: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  gameserver:
    build: ../bmatch-gameserver
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bmatch
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_TOKEN: ${JWT_TOKEN}
    ports: ["127.0.0.1:8004:8004", "127.0.0.1:8005:8005"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      consul: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ../bmatch-frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      gateway: {condition: service_healthy}
      gameserver: {condition: service_healthy}
volumes:
  pgdata:
